# Xbox 360 Armored Core: Verdict Day probe profile.
#
# All addresses are guest addresses with image base 0x82000000.  The cave and
# ring constants were verified in Phase 0 against the live module and the
# static index; tools/xenia-probe/validate.py re-checks every one of them on
# each run.  Do not move a constant here without updating the evidence in
# docs/xenia-probes.md and re-running --verify.

name = "vd"
title_name = "Armored Core: Verdict Day"
title_id = 0x4E4D0864
module_hash = "03794C9BD0139BBF"
image_base = 0x82000000
image_size = 0x1C50000

[paths]
pe = "private/x360/vd/ACV2.pe"
iso = "armoredcoredumps/Armored Core - Verdict Day (USA)/Armored Core - Verdict Day (USA).iso"
xenia_bin = "external/xenia-canary/build/bin/Windows/Release"
xenia_exe = "xenia_canary.exe"
drive = "tools/xenia/drive.py"
recipe = "tools/xenia/recipes/ac_test.txt"
index = "private/index"
index_exe = "target/release/acvd-index.exe"
x360dis = "tools/x360dis/x360dis.py"
named_funcs = "private/tmp/named_funcs.csv"
missions_cache = "private/tmp/missions/mission"
allmaps_cache = "private/tmp/allmaps"
shots = "private/xenia/shots"
runs = "private/xenia"

[patch]
file = "4E4D0864_ACVD_xenia_probe.patch.toml"
name = "ACVD xenia-probe (FFX ring + camera + map warp)"
desc = "Generated by tools/xenia-probe; removed after the probe run."
author = "acvd"
apply_arg = "--apply_patches=true"

[ring]
base = 0x83803400
cap = 1024
recsz = 24
header_size = 0x70
data_offset = 0x100
magic = 0x41585052          # 'AXPR'
version = 1
flags_enabled = 1
flags_dump_ffx = 1

[ring.offsets]
write_index = 0x00
dropped = 0x04
magic = 0x08
version = 0x0C
flags = 0x10
cam_enable = 0x14
cam_ptr = 0x18
cam_seq = 0x1C
cam_eye = 0x20
cam_target = 0x2C
cam_read_eye = 0x38
cam_read_target = 0x44
cam_frame = 0x50
ring_cap = 0x54
ring_recsz = 0x58
warp_mode = 0x5C
warp_calls = 0x60
warp_map = 0x64
warp_msb = 0x68

[hooks.ffx]
addr = 0x82B88A78            # first instruction: mflr r12
word = 0x7D8802A6
next = 0x82B88A7C
cave = "ffx"
fields = "r5=ffx_id r4=request [r4+0x3C]=owner [r4+0x10..18]=xyz"

[hooks.camera]
addr = 0x82BFB338            # CamFx_stateFollow before the view matrix: addi r6,r31,0x20
word = 0x38DF0020
next = 0x82BFB33C
cave = "camera"
note = "r31 is CamFx (shown eye +0x20, target +0x30); r30 is the camera block"

[hooks.mapwarp]
addr = 0x82B40614            # blr of the string formatter 0x82B405A0
word = 0x4E800020
next = 0x4E800020
cave = "mapwarp"
note = "r3 = string object, [r3+4] data, [r3+8] capacity; rewrite for m4000"

[caves.ffx]
base = 0x8260E290
size = 0x200
purpose = "FFX spawn ring writer"

[caves.camera]
base = 0x8260E490
size = 0x200
purpose = "camera readback + override"

[caves.mapwarp]
base = 0x8260E700
size = 0x200
purpose = "path string warp (m4000 -> target map)"

[mission]
getter = 0x825DBB70          # li r3,6000
getter_word = 0x38601770
ac_test_id = 6000
default_map = 4000
warp_source = "m4000"

[map]
# A target map is loaded through the AC Test XML unless an explicit mission is
# given.  m3120 has m3120.msb (mode 1); maps without the base MSB use _map.msb
# for the <Chr> path instead (mode 2).
warp_mode_base_msb = 1
warp_mode_map_msb = 2
warp_mode_off = 0
map_msb = "model/map/{map}/{map}.msb"
map_map_msb = "model/map/{map}/{map}_map.msb"
map_env_msb = "model/map/ch_env/{map}_env.msb"
mission_xml = "mission/ch{id:04d}.xml"

[camera]
shown_eye = 0x20
shown_target = 0x30
max_error_m = 1.0
frame_timeout_ms = 1000
settle_ms = 200
default_dist = 20.0
default_dir = [0.0, 0.35, 1.0]

[nav]
# Strict gates: the front-end must reach the title prompt, then the mission
# env event.  There is no fallback: the previous run took the sortie-load
# instruction before env_bgm and shot the loading fade.
title_label = "press_dialog"
mission_label = "env_bgm"
title_timeout = 60.0
mission_timeout = 240.0
camera_ready_timeout = 10.0
post_env_settle_ms = 5000
drain_interval = 0.015
drain_lag = 16

[probes]
# Minimal navigation/gate list.  The FFX ABI is read through the ring, but the
# post-hook PC and the mission-id return instruction remain useful evidence.
# The cave-exit probes are generated by xenia_probe.py from the actual cave
# lengths, so they cannot drift from the emitted code.
lines = [
  "0x82800128 env_bgm max=1 r4",
  "0x82B29040 press_dialog max=2 r3",
  "0x82B28DB8 gameboot_layout max=2 r3",
  "0x825DBB74 mission_id max=8 r3",
  "0x82B88A7C ffx_post max=200 after=mission_id r5",
  "0x825DCB68 actest_sortie_load max=1 r3"
]

[validation]
# Cave ranges are inside .text functions that Phase 0 showed have no indexed
# callers and 0 live hits.  Their file bytes are not required to be zero.
allow_cave_nonzero = true
index_ignore = ["functions.csv", "names.csv", "ps3_cites.csv", "ps3_to_360.csv"]

[workspace]
resolver = "2"
members = ["crates/acvd-formats", "crates/acvd-data", "crates/acvd-render", "crates/acvd-viewer", "crates/acvd-game", "tools/acvd-sheets", "tools/acvd-index", "tools/acvd-movies"]
# acvd-data (and everything built on it) only exists after `acvd-sheets gen` has run against an owned disc.
default-members = ["crates/acvd-formats", "tools/acvd-sheets"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
roxmltree = "0.20"
miniz_oxide = "0.8"
bevy = "0.19"

[profile.dev.package."*"]
opt-level = 3
# External deps (Bevy/wgpu/naga/image) emit >4 GB of CodeView debug info on MSVC and trip
# `LNK1318: Unexpected PDB error; LIMIT (12)`; keep full debug info on workspace crates only.
debug = false

# Pure format/untile/decode hot loops (Xenos TPF untiling, CTX1/HT-BC3, FLVER/DCX/ANI parsing)
# and mesh/texture asset builders run ~15x faster optimized in debug builds without slowing down
# `acvd-game` incremental builds.
[profile.dev.package.acvd-formats]
opt-level = 3
[profile.dev.package.acvd-render]
opt-level = 3

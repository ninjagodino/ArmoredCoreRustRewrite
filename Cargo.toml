[workspace]
resolver = "2"
members = ["crates/acvd-formats", "crates/acvd-data", "crates/acvd-render", "crates/acvd-viewer", "crates/acvd-game", "tools/acvd-sheets", "tools/acvd-index"]
# acvd-data (and everything built on it) only exists after `acvd-sheets gen` has run against an owned disc.
default-members = ["crates/acvd-formats", "tools/acvd-sheets"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
roxmltree = "0.20"
miniz_oxide = "0.8"
bevy = "0.19"

[profile.dev.package."*"]
opt-level = 3
